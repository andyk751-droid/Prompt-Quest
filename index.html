<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Prompt Quest: a hands-on game for learning to get great results from AI.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prompt Quest: Free Trial</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F0623F">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prompt Quest">
<script data-goatcounter="https://akratech.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: game board — sticky player HUD; home = hero + player card, then a winding world trail; world screen = colored header, 5-stage track, play card */
:root{
  --bg:#EDF0FA; --dot:#D3D9EE; --surface:#FFFFFF; --surface-2:#F3F5FC; --ink:#1B2140; --muted:#5B6287; --line:#DCE1F2;
  --accent:#FF6A4D; --on:#1B2140; --gold:#F2AE2A; --gold-deep:#8F5E00; --good:#16936F; --good-soft:#DDF5EC; --bad:#B42638;
  --tm:68%; --fm:68%; --im:84%; --fill-ink:#FFFFFF; --bad-soft:#FCE4E7;
  --w1:#F0623F; --w2:#7656EC; --w3:#11998A; --w4:#3463DB; --w5:#DB9010; --w6:#D23F78;
  --p-role:#7656EC; --p-task:#DB8A0E; --p-context:#3463DB; --p-examples:#11998A; --p-format:#F0623F; --p-constraints:#B04A9E;
  --olive:var(--w4); --olive-ink:var(--on); --brass:var(--gold-deep); --brass-soft:#FDF0D5;
  --shadow:0 1px 0 rgba(27,33,64,.05),0 10px 28px -14px rgba(27,33,64,.28);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10132A; --dot:#1E2348; --surface:#1B2045; --surface-2:#242A55; --ink:#EEF0FF; --muted:#A6ACD3; --line:#323A6B;
  --accent:#FF8468; --on:#10132A; --gold:#F6C356; --gold-deep:#F6C356; --good:#4BD3A6; --good-soft:#163A33; --bad:#FF7487; --bad-soft:#43202C;
  --w1:#FF8A6C; --w2:#A08BFF; --w3:#3CD2B6; --w4:#709AFF; --w5:#F7BC45; --w6:#F773A5;
  --p-role:#A08BFF; --p-task:#F7BC45; --p-context:#709AFF; --p-examples:#3CD2B6; --p-format:#FF8A6C; --p-constraints:#E08AD6;
  --brass-soft:#3B3017; --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -14px rgba(0,0,0,.6); --tm:100%; --fm:100%; --im:100%; --fill-ink:#10132A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10132A; --dot:#1E2348; --surface:#1B2045; --surface-2:#242A55; --ink:#EEF0FF; --muted:#A6ACD3; --line:#323A6B;
  --accent:#FF8468; --on:#10132A; --gold:#F6C356; --gold-deep:#F6C356; --good:#4BD3A6; --good-soft:#163A33; --bad:#FF7487; --bad-soft:#43202C;
  --w1:#FF8A6C; --w2:#A08BFF; --w3:#3CD2B6; --w4:#709AFF; --w5:#F7BC45; --w6:#F773A5;
  --p-role:#A08BFF; --p-task:#F7BC45; --p-context:#709AFF; --p-examples:#3CD2B6; --p-format:#FF8A6C; --p-constraints:#E08AD6;
  --brass-soft:#3B3017; --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -14px rgba(0,0,0,.6); --tm:100%; --fm:100%; --im:100%; --fill-ink:#10132A; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.08;margin:0;letter-spacing:-.015em}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.ico{display:inline-block;vertical-align:middle;flex:none}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:10px 16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;letter-spacing:-.02em}
.brand .logo{width:34px;height:34px;border-radius:11px;background:conic-gradient(from 200deg,var(--w1),var(--w5),var(--w3),var(--w4),var(--w2),var(--w6),var(--w1));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.stats{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;padding:5px 11px 5px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill .ico{width:22px;height:22px}
.pill.lvl{padding-left:4px}
.pill.lvl svg{width:26px;height:30px}
.pill.hot{color:color-mix(in srgb,var(--accent) var(--tm),#000);border-color:var(--accent)}
.pill.ai{font-weight:600;font-size:12.5px;padding-left:10px}
.pill.ai i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ai.on i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.coin{width:22px;height:22px}
main{padding-block:30px 70px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:10px 18px;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.brass,.btn.gold{background:var(--gold);border-color:var(--gold);color:#3A2600;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn.big{padding:14px 26px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:11px;box-shadow:0 2px 0 var(--line)}
.btn.ghost{background:none;box-shadow:none;border-color:transparent;color:var(--muted)}

/* Home hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:30px;align-items:center;margin-bottom:46px}
.hero h1{font-size:clamp(40px,6.6vw,70px);font-weight:800;letter-spacing:-.035em;line-height:.98}
.hero h1 .hl{background:linear-gradient(100deg,var(--w1),var(--w6) 50%,var(--w2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:50ch;font-size:18px;color:var(--muted);margin:16px 0 22px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.player{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.player::before{content:"";position:absolute;inset:-40% -30% auto auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 35%,transparent),transparent 70%)}
.player .top{display:flex;gap:14px;align-items:center;position:relative}
.player .top svg{width:72px;height:86px}
.player .lv{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;position:relative}
.stat{background:var(--surface-2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.xpbar{margin-top:14px;position:relative}
.xpbar .track{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.xpbar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xpbar .lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.nextup{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:relative}

/* Trail map */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 18px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(28px,4vw,38px);font-weight:800}
.trail{position:relative;display:grid;gap:26px;padding-block:6px}
.trail-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.trow{position:relative;display:flex;align-items:center;gap:22px;justify-content:center}
.trow.alt{flex-direction:row-reverse}
.trow:nth-child(4n+2){transform:translateX(-7%)}
.trow:nth-child(4n+4){transform:translateX(7%)}
.wnode{position:relative;flex:none;width:104px;height:104px;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center;z-index:1}
.wnode .disc{width:80px;height:80px;border-radius:50%;background:color-mix(in srgb,var(--wc) var(--im),#000);color:var(--fill-ink);display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb,var(--wc) 60%,#000),0 14px 24px -10px var(--wc);transition:transform .15s}
.wnode:not(:disabled):hover .disc{transform:translateY(-3px) rotate(-4deg)}
.wnode .disc svg{width:38px;height:38px}
.wnode .ring{position:absolute;inset:0}
.wnode:disabled{cursor:not-allowed}
.wnode:disabled .disc{background:var(--surface-2);color:var(--muted);box-shadow:0 6px 0 var(--line)}
.wnode .crown{position:absolute;top:-2px;right:-2px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#3A2600;display:grid;place-items:center;box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.wnode .crown svg{width:20px;height:20px}
.wnode.current::after{content:"";position:absolute;inset:6px;border-radius:50%;border:3px solid var(--wc);animation:halo 1.8s ease-out infinite;pointer-events:none}
@keyframes halo{from{transform:scale(.95);opacity:.9}to{transform:scale(1.35);opacity:0}}
.wcard{flex:0 1 420px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:6px;position:relative;z-index:1}
.wcard.locked{background:var(--surface-2);box-shadow:none;border-style:dashed}
.wcard .wn{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:color-mix(in srgb,var(--wc) var(--tm),#000)}
.wcard h3{font-size:24px;font-weight:800}
.wcard p{margin:0;font-size:14.5px;color:var(--muted)}
.wcard .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.pips{display:flex;gap:5px}
.pips i{width:22px;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.pips i.on{background:var(--wc);border-color:var(--wc)}
.stars{font-size:18px;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}

.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:50px}
.htile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start}
.htile .bub{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--fill-ink)}
.htile b{font-family:var(--display);font-size:18px;display:block}
.htile span{font-size:14px;color:var(--muted)}
.foot-tools{display:flex;justify-content:center;gap:8px;margin-top:34px;flex-wrap:wrap}

/* World screen */
.whead{position:relative;border-radius:26px;padding:22px clamp(18px,3vw,30px);background:linear-gradient(135deg,color-mix(in srgb,var(--wc) 64%,#141846),color-mix(in srgb,var(--wc) 34%,#141846));color:#fff;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
.whead::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.1);box-shadow:-120px 140px 0 -40px rgba(255,255,255,.07)}
.whead .row1{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1;flex-wrap:wrap}
.whead .back{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.whead .main{display:flex;gap:18px;align-items:center;margin-top:16px;position:relative;z-index:1}
.whead .glyph{width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.whead .glyph svg{width:40px;height:40px}
.whead .wn{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.whead h1{font-size:clamp(30px,5vw,46px);font-weight:800;color:#fff}
.whead p{margin:4px 0 0;opacity:.92;max-width:56ch}
.whead .stars{color:#fff}.whead .stars .off{color:rgba(255,255,255,.35)}

.track{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:6px 0 22px}
.track::before{content:"";position:absolute;left:10%;right:10%;top:27px;height:6px;border-radius:9px;background:var(--line)}
.track .prog{position:absolute;left:10%;top:27px;height:6px;border-radius:9px;background:var(--wc);transition:width .6s}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;min-width:0}
.stage .dot{width:60px;height:60px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.stage .dot svg{width:24px;height:24px}
.stage.boss .dot{width:66px;height:66px;margin-top:-3px}
.stage.done .dot{background:color-mix(in srgb,var(--wc) var(--im),#000);border-color:color-mix(in srgb,var(--wc) var(--im),#000);color:var(--fill-ink)}
.stage[aria-current="true"] .dot{border-color:var(--wc);color:color-mix(in srgb,var(--wc) var(--tm),#000);transform:scale(1.08);box-shadow:0 0 0 6px color-mix(in srgb,var(--wc) 20%,transparent)}
.stage.done[aria-current="true"] .dot{color:var(--fill-ink)}
.stage .lbl{font-size:13px;font-weight:700;text-align:center;line-height:1.2}
.stage:disabled{cursor:not-allowed;opacity:.55}

.act{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow)}
.act-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.act-h .kicker{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:color-mix(in srgb,var(--wc) var(--tm),#000)}
.act-h .kicker svg{width:16px;height:16px}
.act-h h2{font-size:clamp(26px,3.6vw,34px);font-weight:800;margin-top:4px}
.xptag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--gold-deep);background:var(--brass-soft);border-radius:999px;padding:5px 12px 5px 6px;white-space:nowrap}
.xptag svg{width:20px;height:20px}
.intro{max-width:66ch;margin:6px 0 20px;font-size:16.5px}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;padding-top:18px;border-top:2px dashed var(--line);flex-wrap:wrap}
.clear{display:flex;align-items:center;gap:12px;background:var(--good-soft);border:2px solid var(--good);color:var(--ink);border-radius:16px;padding:10px 16px;font-weight:700}
.clear .burst{width:38px;height:38px;border-radius:50%;background:var(--good);color:var(--fill-ink);display:grid;place-items:center;flex:none}
.clear .burst svg{width:22px;height:22px}
.clear b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.clear.pop{animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}

/* Activities */
textarea{width:100%;min-height:120px;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--mono);font-size:13.5px;line-height:1.55;resize:vertical}
textarea:focus{border-color:var(--wc,var(--accent));outline:none}
input[type=text]{width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button .ck{color:var(--good);margin-left:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.out{margin-top:14px;background:var(--surface-2);border:2px dashed var(--line);border-radius:16px;padding:16px;white-space:pre-wrap;font-size:15px;max-height:400px;overflow:auto;min-height:60px}
.out .tag{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:6px}
.scenario{background:var(--brass-soft);border-radius:16px;padding:13px 16px;margin-bottom:14px;font-size:15.5px}
.scenario b{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);display:block;margin-bottom:2px}
.meter{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meter span{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;border:2px solid var(--line);color:var(--muted)}
.meter span.on{background:color-mix(in srgb,var(--mb,var(--w4)) var(--fm),#000);color:var(--fill-ink);border-color:transparent}

.q{margin-bottom:20px}
.q .qt{font-weight:700;margin-bottom:10px;font-size:16.5px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:15.5px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--wc,var(--accent))}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt .box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:7px;margin-top:1px;display:grid;place-items:center;font-size:13px;line-height:1;font-weight:800}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--wc,var(--accent))}
.opt[aria-pressed="true"] .box{background:color-mix(in srgb,var(--wc,var(--accent)) var(--fm),#000);border-color:color-mix(in srgb,var(--wc,var(--accent)) var(--fm),#000);color:var(--fill-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:15px;background:var(--surface-2)}
.fb.good{background:var(--good-soft)}.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px;font-family:var(--display);font-size:17px}
.qprog{display:flex;gap:5px;margin-bottom:16px}
.qprog i{flex:1;height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.qprog i.g{background:var(--good);border-color:var(--good)}.qprog i.b{background:var(--bad);border-color:var(--bad)}.qprog i.c{background:var(--wc,var(--accent));border-color:var(--wc,var(--accent))}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin-bottom:18px}
.lcard{border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);min-width:0;box-shadow:0 3px 0 var(--line)}
.lcard h4{margin:0 0 4px;font-size:18px}
.lcard p{margin:0;font-size:14.5px}
.lcard .ex{margin-top:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.pcard{border-color:var(--pc);box-shadow:0 4px 0 var(--pc)}
.pcard h4{color:color-mix(in srgb,var(--pc) var(--tm),#000);font-size:24px;font-weight:800}
.mnemonic{font-family:var(--display);font-size:clamp(22px,3vw,28px);font-weight:800;margin:4px 0 16px}
.mnemonic b{color:color-mix(in srgb,var(--accent) var(--tm),#000)}
pre.tpl{background:var(--surface-2);border:2px dashed var(--line);border-radius:16px;padding:16px;white-space:pre-wrap;font-family:var(--mono);font-size:13px;overflow-x:auto;margin:0 0 18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{font-size:22px;font-weight:800;margin-bottom:8px}

.palette{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.palette button{border:2px solid var(--pc);color:color-mix(in srgb,var(--pc) var(--tm),#000);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.palette button[aria-pressed="true"]{background:color-mix(in srgb,var(--pc) var(--fm),#000);border-color:color-mix(in srgb,var(--pc) var(--fm),#000);color:var(--fill-ink)}
.segs{line-height:2.2;font-size:16px;background:var(--surface-2);border-radius:16px;padding:14px 16px}
.seg{border:2px dashed var(--muted);background:var(--surface);border-radius:9px;padding:2px 7px;text-align:left;font-size:16px;line-height:1.6;margin:2px 0}
.seg.ok{border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--surface));cursor:default}
.seg.ok sup{font-size:10.5px;color:color-mix(in srgb,var(--pc) var(--tm),#000);text-transform:uppercase;margin-left:5px;font-weight:800}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.duel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dcard{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;font-family:var(--mono);font-size:13px;line-height:1.55;min-width:0;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.dcard:hover:not(:disabled){transform:translateY(-2px);border-color:var(--wc)}
.dcard .lab{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--display);font-size:18px;font-weight:800;margin-bottom:8px}
.dcard.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 4px 0 var(--good)}
.dcard.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}

.slots{display:grid;gap:12px}
.slot label{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px;color:color-mix(in srgb,var(--pc) var(--tm),#000)}
.slot label small{font-weight:500;color:var(--muted);font-size:13px;text-align:right}
.slot textarea{min-height:60px;border-left:6px solid var(--pc)}

.ranklist{display:grid;gap:10px}
.ritem{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;font-family:var(--mono);font-size:13px;box-shadow:0 3px 0 var(--line);align-items:center}
.ritem .pos{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted)}
.ritem.set .pos{background:color-mix(in srgb,var(--wc) var(--fm),#000);color:var(--fill-ink)}
.ritem.right{border-color:var(--good)}.ritem.wrong{border-color:var(--bad)}

.rub{display:grid;gap:10px;margin-top:12px}
.rubrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center}
.seg5{display:flex;gap:6px}
.seg5 button{width:42px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;box-shadow:0 2px 0 var(--line)}
.seg5 button[aria-pressed="true"]{background:color-mix(in srgb,var(--wc) var(--fm),#000);color:var(--fill-ink);border-color:color-mix(in srgb,var(--wc) var(--fm),#000)}
.seg5 button.exp{outline:3px solid var(--gold);outline-offset:2px}

.grade{margin-top:14px;border-radius:18px;padding:16px;background:var(--surface-2)}
.grade .score{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
.grade .score.pass{color:var(--good)}.grade .score.fail{color:var(--bad)}
.grade ul{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.grade .improved{margin-top:12px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:var(--surface);border-radius:12px;padding:10px 12px}
.grade .chip{display:inline-flex;font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.weak{font-family:var(--mono);font-size:14px;background:var(--bad-soft);border-radius:10px;padding:7px 11px;display:inline-block;margin-bottom:10px}
.mission{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.mission h4{margin:0 0 8px;font-size:21px}

.hint{font-size:14px;color:var(--muted);margin:-4px 0 10px;font-weight:600}
.steps{background:var(--surface-2);border-radius:18px;padding:14px 18px 16px;margin:8px 0 22px;border:2px solid color-mix(in srgb,var(--wc,var(--accent)) 30%,var(--line))}
.steps ol{list-style:none;counter-reset:st;margin:8px 0 0;padding:0;display:grid;gap:8px}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:16px;line-height:1.45}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--wc,var(--accent)) var(--fm),#000);color:var(--fill-ink);font-weight:800;font-size:14px;display:grid;place-items:center}
.btn.submit{min-width:120px}
.dcard[aria-pressed="true"]{border-color:var(--wc);box-shadow:0 4px 0 var(--wc);background:color-mix(in srgb,var(--wc) 8%,var(--surface))}
.pack-tag{margin-left:8px;font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:7px;background:var(--ink);color:var(--bg)}
.sort-row{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:grid;gap:9px;background:var(--surface)}
.sort-t{font-weight:700;font-size:15.5px}
.sort-pills{display:flex;flex-wrap:wrap;gap:6px}
.sort-pill{border:2px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:700}
.sort-pill[aria-pressed="true"]{background:color-mix(in srgb,var(--wc,var(--accent)) var(--fm),#000);border-color:color-mix(in srgb,var(--wc,var(--accent)) var(--fm),#000);color:var(--fill-ink)}
.sort-pill:disabled{cursor:default}
.sort-row.right{border-color:var(--good);background:var(--good-soft)}
.sort-row.wrong{border-color:var(--bad);background:var(--bad-soft)}
.sort-fix{font-size:14px;font-weight:700;color:var(--bad)}
.cs-world{margin:30px 0 12px}
.cs-world .wn{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:color-mix(in srgb,var(--wc) var(--tm),#000)}
.cs-world h3{font-size:26px;font-weight:800}
.addon-promo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:34px;padding:16px 18px;border-radius:var(--r);border:2px dashed color-mix(in srgb,var(--w2) 45%,var(--line));background:color-mix(in srgb,var(--w2) 7%,var(--surface))}
.addon-promo-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--w2) var(--im),#000);color:var(--fill-ink)}
.addon-help{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:11px 14px;border-radius:14px;background:var(--surface-2);font-size:14.5px}
.addon-help .spark-m{width:30px;height:30px;flex:none}
.addons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.addon{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.addon-art{position:relative;height:110px;display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--wc) 64%,#141846),color-mix(in srgb,var(--wc) 34%,#141846));color:#fff}
.addon-glyph{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.addon-n{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.addon-body{display:flex;flex-direction:column;gap:8px;padding:16px;flex:1}
.addon-body h3{font-size:22px;font-weight:800}
.addon-body p{margin:0;font-size:14.5px}
.addon-worlds{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.addon-worlds span{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2)}
.addon .chip{display:inline-flex;align-items:center;font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line)}
.addon .chip.ok{border-color:var(--good);background:var(--good-soft)}
.pack-head{display:grid;gap:2px;justify-items:center;text-align:center;margin:26px 0 4px}
.pack-head .wn{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:color-mix(in srgb,var(--wc) var(--tm),#000)}
.pack-head h3{font-size:28px;font-weight:800}
/* Trophies */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.badge{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.badge svg{width:52px;height:52px;flex:none}
.badge.off{opacity:.5;box-shadow:none}
.badge.off svg{filter:grayscale(1)}
.badge b{display:block;font-size:15px}
.badge span{font-size:13px;color:var(--muted)}
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px;margin-top:12px}
.rk{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:var(--surface)}
.rk svg{width:40px;height:48px}
.rk.me{border:2px solid var(--gold);box-shadow:0 4px 0 var(--gold)}
.rk .x{font-size:12px;color:var(--muted);font-weight:600}
.rk b{display:block;font-size:14px}

/* Champion card */
.cert{margin-top:46px}
.certificate{border-radius:28px;padding:34px 22px;text-align:center;background:linear-gradient(135deg,color-mix(in srgb,var(--w2) 66%,#141846),color-mix(in srgb,var(--w6) 60%,#141846) 55%,color-mix(in srgb,var(--w1) 58%,#141846));color:#fff;box-shadow:var(--shadow)}
.certificate .eyebrow{color:rgba(255,255,255,.85)}
.certificate h2{font-size:clamp(30px,5vw,48px);font-weight:800;color:#fff}
.certificate .who{font-family:var(--display);font-size:36px;font-weight:800;border-bottom:2px solid rgba(255,255,255,.5);display:inline-block;padding:0 18px 2px;margin:10px 0}

/* Toasts / modal */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:20;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 16px;font-weight:700;font-size:15px;box-shadow:0 10px 26px rgba(0,0,0,.3);animation:pop .35s cubic-bezier(.2,1.5,.4,1);max-width:300px}
.toast small{display:block;font-weight:500;opacity:.8}
@keyframes pop{from{transform:translateY(16px) scale(.9);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(12,14,34,.6);display:grid;place-items:center;z-index:30;padding:20px;backdrop-filter:blur(3px)}
.modal .card{background:var(--surface);border-radius:28px;padding:30px;text-align:center;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.modal svg{width:96px;height:114px}
.modal h2{font-size:40px;font-weight:800;margin:6px 0 8px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.welcome .wl-ico{width:76px;height:76px;border-radius:24px;margin:0 auto 12px;display:grid;place-items:center;background:color-mix(in srgb,var(--wc) var(--im),#000);color:var(--fill-ink)}
.welcome .wl-ico svg{width:36px;height:36px}
.wl-dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.wl-dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.wl-dots i.on{width:24px;background:var(--accent)}
.welcome h2{font-size:30px;margin:4px 0 8px}

/* ---- polish: steps, flip cards, celebrations, mascot, streak, share ---- */
.nav .ico{display:none}
.pill.snd{padding:6px 9px}
.pill.snd .ico{width:18px;height:18px}
details.steps>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
details.steps>summary::-webkit-details-marker{display:none}
details.steps>summary::after{content:"Hide";margin-left:auto;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
details.steps:not([open])>summary::after{content:"Show"}
details.steps:not([open]){padding:10px 18px;margin-bottom:16px}
.spark-m.tiny{width:22px;height:22px;flex:none}
.cards.flips{perspective:1400px}
.flip{position:relative;display:grid;border:0;padding:0;background:none;text-align:left;min-height:178px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1);color:inherit;font:inherit}
.flip>.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:16px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.flip .front{justify-content:space-between;background:linear-gradient(150deg,color-mix(in srgb,var(--wc,var(--accent)) 16%,var(--surface)),var(--surface) 70%);border-color:color-mix(in srgb,var(--wc,var(--accent)) 35%,var(--line))}
.flip:hover .front{border-color:var(--wc,var(--accent))}
.flip .cico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--wc,var(--accent)) var(--im),#000);color:var(--fill-ink)}
.flip .front h4{font-size:19px;margin:0}
.flip .front small{font-size:12.5px;font-weight:700;color:var(--muted)}
.flip .back{transform:rotateY(180deg)}
.flip.on{transform:rotateY(180deg)}
.flip .back h4{font-size:16px;margin:0}
.flip .back p{margin:0;font-size:14.5px}
.flip .back .ex{font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.cardnote{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-4px 0 12px;font-size:14px;font-weight:700;color:var(--muted)}
.opt.pop{animation:bounce .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes bounce{0%{transform:scale(.97)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
.flycoin{position:fixed;z-index:45;width:28px;height:28px;pointer-events:none;transition:transform .8s cubic-bezier(.3,.7,.3,1),opacity .8s}
.flycoin svg{width:28px;height:28px}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.2)}}
.clear .mascot{width:54px;height:54px;flex:none;display:block}
.clear .mascot svg{width:54px;height:54px}
.spark-m.float{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-5px)}}
.welcome .wl-mascot{width:116px;height:116px;margin:0 auto 6px}
.modal .welcome .wl-mascot svg,.modal .lvl-pair .spark-m{width:110px;height:110px}
.lvl-pair{display:flex;justify-content:center;align-items:center;gap:4px}
.daygoal{display:flex;align-items:center;gap:9px;margin-top:12px;padding:9px 12px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:14px;position:relative}
.daygoal .dg-ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--brass-soft);color:var(--gold-deep)}
.daygoal.done .dg-ico{background:var(--good);color:var(--fill-ink)}
.collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.cchip{border:2px dashed var(--line);border-radius:12px;padding:9px 11px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0}
.cchip.on{border-style:solid;border-color:color-mix(in srgb,var(--wc) 45%,var(--line));color:var(--ink);background:color-mix(in srgb,var(--wc) 8%,var(--surface))}
.cchip .wn{font-size:11px;font-weight:800;flex:none;color:color-mix(in srgb,var(--wc) var(--tm),#000)}
.modal .card.share{max-width:600px}
a.btn{text-decoration:none}
.share img{display:block}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .howto{grid-template-columns:1fr}
  .stats{margin-left:0;width:100%}
}
@media (max-width:640px){
  .trow,.trow.alt{flex-direction:row;justify-content:flex-start;gap:14px;transform:none!important}
  .wnode{width:84px;height:84px}.wnode .disc{width:64px;height:64px}.wnode .disc svg{width:30px;height:30px}
  .wcard{flex:1 1 auto}
  .track::before,.track .prog{top:21px}
  .stage .dot{width:48px;height:48px}.stage.boss .dot{width:52px;height:52px;margin-top:-2px}
  .stage .lbl{font-size:11.5px}
  .duel{grid-template-columns:1fr}
  .rubrow{grid-template-columns:1fr}
  .hud{position:sticky;backdrop-filter:none;background:var(--surface)}
  .hud .wrap{flex-wrap:nowrap;gap:8px;padding-block:8px}
  .brand{font-size:18px;gap:7px}.brand .logo{width:30px;height:30px;border-radius:9px}
  .pack-tag{display:none}
  .stats{margin-left:auto;width:auto;gap:6px;flex-wrap:nowrap}
  .pill.lvl,.pill.trophy{display:none}
  .pill{font-size:13px;padding:4px 9px 4px 5px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;gap:4px;margin:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px -12px rgba(0,0,0,.25);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
  .nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;padding:6px 4px;font-size:12px}
  .nav .ico{display:block;width:22px;height:22px}
  .nav button[aria-current="true"]{background:var(--surface-2);color:var(--ink)}
  main{padding-block:16px 112px}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

const CHECKS={
  connector:[{re:/\b(e-?mail|gmail|outlook|inbox|calendar|drive|dropbox|onedrive|connected|folder)\b/i,label:'Say which connected app to use (email, calendar, Drive\u2026).'},

const CHECK_TEXT={connector:'This prompt uses connected apps: reward naming which app to use, saying what to return, and a safety rule such as draft-only, confirm before sending, or do not delete.',
  power:'This is a power-user prompt: it should name the connected app or uploaded file to use, ask for a specific result and format, and include a safety rule such as draft only, ask before acting, or say Not found.'};
function localGrade(text,opts={}){
  const p=analyze(text);const n=Object.values(p).filter(Boolean).length;const w=words(text);
  let score=n*13; if(w>=25)score+=8; if(w>=45)score+=6; if(w>350)score-=6;
  const vars=(text.match(/\[[^\]]{2,}\]/g)||[]).length;
  if(opts.template){score+=vars>=2?8:vars===1?4:-10;}
  const ck=CHECKS[opts.checks]||[];ck.forEach(c=>{score+=c.re.test(text)?7:-6;});
  score=Math.max(5,Math.min(100,Math.round(score)));
  const miss=PARTS.filter(x=>!p[x.k]);
  const fixes=miss.slice(0,3).map(x=>`Add ${x.n}: ${x.d.toLowerCase()} e.g. “${x.ex}”`);
  if(opts.template&&vars===0)fixes.unshift('Add [VARIABLES] in square brackets for the parts that change each time.');

  if(w<20)fixes.unshift('It’s very short. Add the details the AI can’t guess.');

  return {score,parts:p,strengths,fixes:fixes.slice(0,3),improved:'',source:'local'};

async function aiGrade(text,scenario,opts={}){
  const extra=opts.template?'This is meant to be a REUSABLE TEMPLATE: reward [BRACKETED VARIABLES] for parts that change, standing rules, a fixed output format, and guardrails. Penalize hard-coded one-time details.':''+(CHECK_TEXT[opts.checks]?' '+CHECK_TEXT[opts.checks]:'');
  const prompt=`You are a prompt-engineering instructor grading a learner's prompt in a training course.\n\nScenario the learner was given: ${scenario}\n\nLearner's prompt:\n<prompt>\n${text.slice(0,6000)}\n</prompt>\n\nGrade how well this prompt would get a useful first-try result from an AI assistant. Check six parts: role, task, context, examples, format, constraints. Not every task needs every part; judge fitness for this scenario. ${extra}\nScore 0-100, where 70 is solid and 85+ is excellent. Be encouraging but honest and specific. Write plain sentences.\n\nReply with only JSON in this shape:\n{"score": 0, "parts": {"role": false, "task": false, "context": false, "examples": false, "format": false, "constraints": false}, "strengths": ["up to 2 short strings"], "fixes": ["up to 3 short, specific strings"], "improved": "a stronger version of the prompt, under 130 words"}`;
  const r=await sample.json(prompt,{modelTier:'default'});
  if(!r||typeof r.score!=='number')throw {code:'invalid_json'};
  const parts={};PARTS.forEach(x=>parts[x.k]=!!(r.parts&&r.parts[x.k]));

}

}

  h('div',{class:'meter'},PARTS.map(x=>h('span',{class:g.parts[x.k]?'on':'',style:g.parts[x.k]?`--mb:var(--p-${x.k})`:''},(g.parts[x.k]?'✓ ':'')+x.n))),
  g.strengths.length?h('div',{style:'margin-top:8px'},h('b',{},'Strengths'),h('ul',{},g.strengths.map(s=>h('li',{},s)))):null,

    h('p',{class:'muted',style:'margin:0 0 14px;font-size:14.5px'},'Download the image, then post it anywhere. On a phone, you can also press and hold the image to save it.'),
    h('div',{class:'row',style:'justify-content:center'},url?h('a',{class:'btn primary',href:url,download:'prompt-quest-progress.png'},'Download image'):null,sh,h('button',{class:'btn ghost',onclick:()=>m.remove()},'Close'))));
  $('#modalRoot').innerHTML='';$('#modalRoot').append(m);}
/* ============ ADD-ONS ============ */
const IS_PACK=false;
/* Ko-fi Shop links for each pack. Blank = shows "Coming soon to Ko-fi". */
const ADDON_LINKS={poweruser:'https://ko-fi.com/s/a8ffea83fd',creator:'',agent:''};
const CATALOG=[
  {id:'poweruser',name:'Power User Pack',tag:'Connectors, using any AI like a pro, and getting real answers from your files.',worlds:['Know Your Toolbox','Plug It In','One Prompt, Any AI','Files In, Files Out'],price:'$2.99',c:'--w3',g:'plug',status:'available'},
  {id:'creator',name:'Creator Pack',tag:'Make documents, images, charts, and more with AI.',worlds:['Document Factory','Picture This','Numbers to Charts','Sound and Motion'],price:'$2.99',c:'--w6',g:'files',status:'soon'},
  {id:'agent',name:'Agent Architect Pack',tag:'Write agent instructions, design workflows, and build your own AI agent.',worlds:['What’s an Agent?','The System Prompt','Tools and Workflows','Test It, Break It','Final Boss'],price:'$2.99',c:'--w2',g:'crown',status:'soon'}
];
const PACK_KEY=KEY+'.packs';
function loadPacks(){try{return JSON.parse(localStorage.getItem(PACK_KEY)||'{}')||{};}catch(e){return {};}}
function savePacks(p){try{localStorage.setItem(PACK_KEY,JSON.stringify(p));return true;}catch(e){return false;}}
function worldLabel(i){const m=MODULES[i];return m&&m.pack?`${m.packName} · World ${m.packNum}`:`World ${i+1}`;}
function packTrack(n){try{if(typeof track==='function')track(n);}catch(e){}}
function applyPack(p){if(!p||!Array.isArray(p.worlds)||MODULES.some(m=>m.pack===p.id))return;if(p.glyphs)Object.assign(G,p.glyphs);
  p.worlds.forEach((w,i)=>{const m=JSON.parse(JSON.stringify(w));m.id=`${p.id}-${w.id}`;m.pack=p.id;m.packName=p.short||p.name;m.packNum=i+1;if(i===0)m.packStart=true;MODULES.push(m);WORLD.push((p.world&&p.world[i])||{c:'--w4',g:'target'});});}
function removePack(id){const all=loadPacks();delete all[id];savePacks(all);for(let i=MODULES.length-1;i>=0;i--){if(MODULES[i].pack===id){MODULES.splice(i,1);WORLD.splice(i,1);}}}
function installFromFile(file){const r=new FileReader();
  r.onload=()=>{let p=null;try{const mt=String(r.result).match(/<script type="application\/json" id="pq-pack">([\s\S]*?)<\/script>/);if(mt)p=JSON.parse(mt[1]);}catch(e){p=null;}
    if(!p||!p.id||!Array.isArray(p.worlds)){toast('That file isn’t a Prompt Quest pack','Choose the pack file you downloaded from Ko-fi. It ends in .html.');return;}
    const all=loadPacks();const had=!!all[p.id];all[p.id]=p;
    if(!savePacks(all)){toast('Couldn’t save the pack','Your browser blocked storage. Try a normal (not private) window.');return;}
    if(had)removePackModules(p.id);applyPack(p);packTrack('addon-installed-'+p.id);sfx('level');confetti();
    toast(`${p.name} installed!`,'Its worlds are now on your map.');view.screen='addons';render();};
  r.onerror=()=>toast('Couldn’t read that file','Try downloading the pack again.');r.readAsText(file);}
function removePackModules(id){for(let i=MODULES.length-1;i>=0;i--){if(MODULES[i].pack===id){MODULES.splice(i,1);WORLD.splice(i,1);}}}
let addonInput=null;
function pickPackFile(){if(!addonInput){addonInput=h('input',{type:'file',accept:'.html,.htm,text/html',id:'pack-file',style:'display:none'});addonInput.addEventListener('change',()=>{const fl=addonInput.files&&addonInput.files[0];if(fl)installFromFile(fl);addonInput.value='';});document.body.append(addonInput);}addonInput.click();}
function renderAddons(){const app=$('#app');app.innerHTML='';const inst=loadPacks();packTrack('addons-viewed');
  app.append(h('div',{class:'sec-h'},h('div',{},h('h2',{},'Add-ons'),h('p',{class:'muted',style:'margin:6px 0 0;max-width:60ch;font-size:15px'},'New worlds for Prompt Quest. Install a pack once and its worlds join your map, with the same coins, levels, and trophies.')),
    h('button',{class:'btn primary',onclick:pickPackFile,html:`${ico('addon',18)} Install a pack`})));
  app.append(h('div',{class:'addon-help',html:`${spark('happy')}<span>Bought a pack? Click <b>Install a pack</b> and choose the file you downloaded from Ko-fi. It ends in .html.</span>`}));
  const grid=h('div',{class:'addons'});
  CATALOG.forEach(c=>{const installed=!!inst[c.id]&&MODULES.some(m=>m.pack===c.id);const link=ADDON_LINKS[c.id];const first=MODULES.findIndex(m=>m.pack===c.id);let actions;
    if(installed)actions=[h('span',{class:'chip ok'},'✓ Installed'),h('button',{class:'btn primary sm',onclick:()=>{const ff=PHASES.findIndex(p=>!S.done[pk(MODULES[first].id,p.k)]);go('module',first,ff<0?0:ff);}},'Play'),
      h('button',{class:'btn ghost sm',onclick:e=>{const b=e.currentTarget;if(!b.dataset.arm){b.dataset.arm='1';b.textContent='Tap again to remove';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='Remove';}},4000);return;}removePack(c.id);toast(`${c.name} removed`,'Your progress is kept if you install it again.');render();}},'Remove')];
    else if(c.status==='soon')actions=[h('span',{class:'chip'},'Coming soon')];
    else actions=[link?h('a',{class:'btn primary sm',href:link,target:'_blank',rel:'noopener',onclick:()=>packTrack('addon-buy-'+c.id)},`Get it · ${c.price}`):h('span',{class:'chip'},'Coming soon to Ko-fi'),h('button',{class:'btn sm',onclick:pickPackFile},'Already bought it? Install')];
    grid.append(h('article',{class:'addon',style:`--wc:var(${c.c})`},
      h('div',{class:'addon-art'},h('span',{class:'addon-glyph',html:ico(c.g,32,2.2)}),h('span',{class:'addon-n'},`${c.worlds.length} worlds · ${c.worlds.length*5} stages`)),
      h('div',{class:'addon-body'},h('h3',{},c.name),h('p',{class:'muted'},c.tag),h('div',{class:'addon-worlds'},c.worlds.map(w=>h('span',{},w))),h('div',{class:'row',style:'margin-top:auto'},actions))));});
  app.append(grid);}
if(!IS_PACK){Object.values(loadPacks()).forEach(p=>{try{applyPack(p);}catch(e){}});}

/* ============ FREE TRIAL ============ */
/* Counts a few anonymous events (no names, no cookies) so you can see where trial players go. */
function track(name){try{if(window.goatcounter&&goatcounter.count)goatcounter.count({path:name,title:name,event:true});}catch(e){}}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;if(a.href===BUY_URL)track('buy-click');else if(TIP_URL&&a.href===TIP_URL)track('tip-click');});
{const _cp=completePhase;completePhase=function(mi,pi,extra){const first=!S.done[pk(MODULES[mi].id,PHASES[pi].k)];_cp(mi,pi,extra);if(first)track('stage-cleared-w'+(mi+1)+'-s'+(pi+1));};}
function upsell(){track('upsell-shown');const m=h('div',{class:'modal',role:'dialog','aria-modal':'true'},h('div',{class:'card'},
  h('div',{class:'eyebrow'},'Free stage complete'),
  h('h2',{},'Nice work. Ready for the rest?'),
  h('p',{class:'muted'},'The full game has 6 worlds and 30 stages. Spot the six prompt ingredients, fix broken prompts, build your own from scratch, judge like a pro, and create a reusable Signature Prompt. Finish to earn your Champion card.'),
  h('div',{class:'row'},h('a',{class:'btn primary big',href:BUY_URL,target:'_blank',rel:'noopener'},'Get the full game – $2.99'),h('button',{class:'btn',onclick:()=>{m.remove();go('home');}},'Back to the map'))));
  $('#modalRoot').append(m);}
function trialBanner(){return h('div',{class:'trialbar'},
  h('div',{},h('b',{},'Free trial: Stage 1'),h('span',{},' Unlock all 6 worlds, 30 stages, and your Champion card.')),
  h('div',{class:'row',style:'margin:0'},TIP_URL?h('a',{class:'btn sm',href:TIP_URL,target:'_blank',rel:'noopener'},'☕ Tip'):null,h('a',{class:'btn primary sm',href:BUY_URL,target:'_blank',rel:'noopener'},'Get the full game – $2.99')));}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
$('#brand').onclick=()=>go('home');
render();
(async()=>{try{ if(window.claude&&claude.use){ sample=await claude.use('sample'); } }catch(e){} aiState=sample?'ready':'offline'; renderHUD(); })();
</script>
