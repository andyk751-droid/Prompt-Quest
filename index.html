<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Prompt Quest: a hands-on game for learning to get great results from AI.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prompt Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: game board — sticky player HUD; home = hero + player card, then a winding world trail; world screen = colored header, 5-stage track, play card */
:root{
  --bg:#EDF0FA; --dot:#D3D9EE; --surface:#FFFFFF; --surface-2:#F3F5FC; --ink:#1B2140; --muted:#5B6287; --line:#DCE1F2;
  --accent:#FF6A4D; --on:#FFFFFF; --gold:#F2AE2A; --gold-deep:#B97A06; --good:#16936F; --good-soft:#DDF5EC; --bad:#D93D52; --bad-soft:#FCE4E7;
  --w1:#F0623F; --w2:#7656EC; --w3:#11998A; --w4:#3463DB; --w5:#DB9010; --w6:#D23F78;
  --p-role:#7656EC; --p-task:#DB8A0E; --p-context:#3463DB; --p-examples:#11998A; --p-format:#F0623F; --p-constraints:#B04A9E;
  --olive:var(--w4); --olive-ink:var(--on); --brass:var(--gold-deep); --brass-soft:#FDF0D5;
  --shadow:0 1px 0 rgba(27,33,64,.05),0 10px 28px -14px rgba(27,33,64,.28);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10132A; --dot:#1E2348; --surface:#1B2045; --surface-2:#242A55; --ink:#EEF0FF; --muted:#A6ACD3; --line:#323A6B;
  --accent:#FF8468; --on:#10132A; --gold:#F6C356; --gold-deep:#F6C356; --good:#4BD3A6; --good-soft:#163A33; --bad:#FF7487; --bad-soft:#43202C;
  --w1:#FF8A6C; --w2:#A08BFF; --w3:#3CD2B6; --w4:#709AFF; --w5:#F7BC45; --w6:#F773A5;
  --p-role:#A08BFF; --p-task:#F7BC45; --p-context:#709AFF; --p-examples:#3CD2B6; --p-format:#FF8A6C; --p-constraints:#E08AD6;
  --brass-soft:#3B3017; --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10132A; --dot:#1E2348; --surface:#1B2045; --surface-2:#242A55; --ink:#EEF0FF; --muted:#A6ACD3; --line:#323A6B;
  --accent:#FF8468; --on:#10132A; --gold:#F6C356; --gold-deep:#F6C356; --good:#4BD3A6; --good-soft:#163A33; --bad:#FF7487; --bad-soft:#43202C;
  --w1:#FF8A6C; --w2:#A08BFF; --w3:#3CD2B6; --w4:#709AFF; --w5:#F7BC45; --w6:#F773A5;
  --p-role:#A08BFF; --p-task:#F7BC45; --p-context:#709AFF; --p-examples:#3CD2B6; --p-format:#FF8A6C; --p-constraints:#E08AD6;
  --brass-soft:#3B3017; --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.08;margin:0;letter-spacing:-.015em}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.ico{display:inline-block;vertical-align:middle;flex:none}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:10px 16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;letter-spacing:-.02em}
.brand .logo{width:34px;height:34px;border-radius:11px;background:conic-gradient(from 200deg,var(--w1),var(--w5),var(--w3),var(--w4),var(--w2),var(--w6),var(--w1));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.stats{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;padding:5px 11px 5px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill .ico{width:22px;height:22px}
.pill.lvl{padding-left:4px}
.pill.lvl svg{width:26px;height:30px}
.pill.hot{color:var(--accent);border-color:var(--accent)}
.pill.ai{font-weight:600;font-size:12.5px;padding-left:10px}
.pill.ai i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ai.on i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.coin{width:22px;height:22px}
main{padding-block:30px 70px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:10px 18px;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.brass,.btn.gold{background:var(--gold);border-color:var(--gold);color:#3A2600;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn.big{padding:14px 26px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:11px;box-shadow:0 2px 0 var(--line)}
.btn.ghost{background:none;box-shadow:none;border-color:transparent;color:var(--muted)}

/* Home hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:30px;align-items:center;margin-bottom:46px}
.hero h1{font-size:clamp(40px,6.6vw,70px);font-weight:800;letter-spacing:-.035em;line-height:.98}
.hero h1 .hl{background:linear-gradient(100deg,var(--w1),var(--w6) 50%,var(--w2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:50ch;font-size:18px;color:var(--muted);margin:16px 0 22px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.player{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.player::before{content:"";position:absolute;inset:-40% -30% auto auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 35%,transparent),transparent 70%)}
.player .top{display:flex;gap:14px;align-items:center;position:relative}
.player .top svg{width:72px;height:86px}
.player .lv{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;position:relative}
.stat{background:var(--surface-2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.xpbar{margin-top:14px;position:relative}
.xpbar .track{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.xpbar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xpbar .lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.nextup{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:relative}

/* Trail map */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 18px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(28px,4vw,38px);font-weight:800}
.trail{position:relative;display:grid;gap:26px;padding-block:6px}
.trail-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.trow{position:relative;display:flex;align-items:center;gap:22px;justify-content:center}
.trow.alt{flex-direction:row-reverse}
.trow:nth-child(4n+2){transform:translateX(-7%)}
.trow:nth-child(4n+4){transform:translateX(7%)}
.wnode{position:relative;flex:none;width:104px;height:104px;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center;z-index:1}
.wnode .disc{width:80px;height:80px;border-radius:50%;background:var(--wc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb,var(--wc) 60%,#000),0 14px 24px -10px var(--wc);transition:transform .15s}
.wnode:not(:disabled):hover .disc{transform:translateY(-3px) rotate(-4deg)}
.wnode .disc svg{width:38px;height:38px}
.wnode .ring{position:absolute;inset:0}
.wnode:disabled{cursor:not-allowed}
.wnode:disabled .disc{background:var(--surface-2);color:var(--muted);box-shadow:0 6px 0 var(--line)}
.wnode .crown{position:absolute;top:-2px;right:-2px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#3A2600;display:grid;place-items:center;box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.wnode .crown svg{width:20px;height:20px}
.wnode.current::after{content:"";position:absolute;inset:6px;border-radius:50%;border:3px solid var(--wc);animation:halo 1.8s ease-out infinite;pointer-events:none}
@keyframes halo{from{transform:scale(.95);opacity:.9}to{transform:scale(1.35);opacity:0}}
.wcard{flex:0 1 420px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:6px;position:relative;z-index:1}
.wcard.locked{opacity:.62}
.wcard .wn{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--wc)}
.wcard h3{font-size:24px;font-weight:800}
.wcard p{margin:0;font-size:14.5px;color:var(--muted)}
.wcard .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.pips{display:flex;gap:5px}
.pips i{width:22px;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.pips i.on{background:var(--wc);border-color:var(--wc)}
.stars{font-size:18px;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}

.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:50px}
.htile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start}
.htile .bub{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.htile b{font-family:var(--display);font-size:18px;display:block}
.htile span{font-size:14px;color:var(--muted)}
.foot-tools{display:flex;justify-content:center;gap:8px;margin-top:34px;flex-wrap:wrap}

/* World screen */
.whead{position:relative;border-radius:26px;padding:22px clamp(18px,3vw,30px);background:linear-gradient(135deg,color-mix(in srgb,var(--wc) 88%,#000),color-mix(in srgb,var(--wc) 55%,#1B2140));color:#fff;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
.whead::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.1);box-shadow:-120px 140px 0 -40px rgba(255,255,255,.07)}
.whead .row1{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1;flex-wrap:wrap}
.whead .back{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.whead .main{display:flex;gap:18px;align-items:center;margin-top:16px;position:relative;z-index:1}
.whead .glyph{width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.whead .glyph svg{width:40px;height:40px}
.whead .wn{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.whead h1{font-size:clamp(30px,5vw,46px);font-weight:800;color:#fff}
.whead p{margin:4px 0 0;opacity:.92;max-width:56ch}
.whead .stars{color:#fff}.whead .stars .off{color:rgba(255,255,255,.35)}

.track{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:6px 0 22px}
.track::before{content:"";position:absolute;left:10%;right:10%;top:27px;height:6px;border-radius:9px;background:var(--line)}
.track .prog{position:absolute;left:10%;top:27px;height:6px;border-radius:9px;background:var(--wc);transition:width .6s}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;min-width:0}
.stage .dot{width:60px;height:60px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.stage .dot svg{width:24px;height:24px}
.stage.boss .dot{width:66px;height:66px;margin-top:-3px}
.stage.done .dot{background:var(--wc);border-color:var(--wc);color:#fff}
.stage[aria-current="true"] .dot{border-color:var(--wc);color:var(--wc);transform:scale(1.08);box-shadow:0 0 0 6px color-mix(in srgb,var(--wc) 20%,transparent)}
.stage.done[aria-current="true"] .dot{color:#fff}
.stage .lbl{font-size:13px;font-weight:700;text-align:center;line-height:1.2}
.stage:disabled{cursor:not-allowed;opacity:.55}

.act{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow)}
.act-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.act-h .kicker{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--wc)}
.act-h .kicker svg{width:16px;height:16px}
.act-h h2{font-size:clamp(26px,3.6vw,34px);font-weight:800;margin-top:4px}
.xptag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--gold-deep);background:var(--brass-soft);border-radius:999px;padding:5px 12px 5px 6px;white-space:nowrap}
.xptag svg{width:20px;height:20px}
.intro{max-width:66ch;margin:6px 0 20px;font-size:16.5px}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;padding-top:18px;border-top:2px dashed var(--line);flex-wrap:wrap}
.clear{display:flex;align-items:center;gap:12px;background:var(--good-soft);border:2px solid var(--good);color:var(--ink);border-radius:16px;padding:10px 16px;font-weight:700}
.clear .burst{width:38px;height:38px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;flex:none}
.clear .burst svg{width:22px;height:22px}
.clear b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.clear.pop{animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}

/* Activities */
textarea{width:100%;min-height:120px;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--mono);font-size:13.5px;line-height:1.55;resize:vertical}
textarea:focus{border-color:var(--wc,var(--accent));outline:none}
input[type=text]{width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button .ck{color:var(--good);margin-left:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.out{margin-top:14px;background:var(--surface-2);border:2px dashed var(--line);border-radius:16px;padding:16px;white-space:pre-wrap;font-size:15px;max-height:400px;overflow:auto;min-height:60px}
.out .tag{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:6px}
.scenario{background:var(--brass-soft);border-radius:16px;padding:13px 16px;margin-bottom:14px;font-size:15.5px}
.scenario b{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);display:block;margin-bottom:2px}
.meter{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meter span{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;border:2px solid var(--line);color:var(--muted)}
.meter span.on{color:#fff;border-color:transparent}

.q{margin-bottom:20px}
.q .qt{font-weight:700;margin-bottom:10px;font-size:16.5px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:15.5px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--wc,var(--accent))}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt .box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:7px;margin-top:1px;display:grid;place-items:center;font-size:13px;line-height:1;font-weight:800}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--wc,var(--accent))}
.opt[aria-pressed="true"] .box{background:var(--wc,var(--accent));border-color:var(--wc,var(--accent));color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:15px;background:var(--surface-2)}
.fb.good{background:var(--good-soft)}.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px;font-family:var(--display);font-size:17px}
.qprog{display:flex;gap:5px;margin-bottom:16px}
.qprog i{flex:1;height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.qprog i.g{background:var(--good);border-color:var(--good)}.qprog i.b{background:var(--bad);border-color:var(--bad)}.qprog i.c{background:var(--wc,var(--accent));border-color:var(--wc,var(--accent))}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin-bottom:18px}
.lcard{border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);min-width:0;box-shadow:0 3px 0 var(--line)}
.lcard h4{margin:0 0 4px;font-size:18px}
.lcard p{margin:0;font-size:14.5px}
.lcard .ex{margin-top:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.pcard{border-color:var(--pc);box-shadow:0 4px 0 var(--pc)}
.pcard h4{color:var(--pc);font-size:24px;font-weight:800}
.mnemonic{font-family:var(--display);font-size:clamp(22px,3vw,28px);font-weight:800;margin:4px 0 16px}
.mnemonic b{color:var(--accent)}
pre.tpl{background:var(--surface-2);border:2px dashed var(--line);border-radius:16px;padding:16px;white-space:pre-wrap;font-family:var(--mono);font-size:13px;overflow-x:auto;margin:0 0 18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{font-size:22px;font-weight:800;margin-bottom:8px}

.palette{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.palette button{border:2px solid var(--pc);color:var(--pc);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.palette button[aria-pressed="true"]{background:var(--pc);color:#fff}
.segs{line-height:2.2;font-size:16px;background:var(--surface-2);border-radius:16px;padding:14px 16px}
.seg{border:2px dashed var(--muted);background:var(--surface);border-radius:9px;padding:2px 7px;text-align:left;font-size:16px;line-height:1.6;margin:2px 0}
.seg.ok{border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--surface));cursor:default}
.seg.ok sup{font-size:10.5px;color:var(--pc);text-transform:uppercase;margin-left:5px;font-weight:800}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.duel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dcard{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;font-family:var(--mono);font-size:13px;line-height:1.55;min-width:0;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.dcard:hover:not(:disabled){transform:translateY(-2px);border-color:var(--wc)}
.dcard .lab{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--display);font-size:18px;font-weight:800;margin-bottom:8px}
.dcard.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 4px 0 var(--good)}
.dcard.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}

.slots{display:grid;gap:12px}
.slot label{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px;color:var(--pc)}
.slot label small{font-weight:500;color:var(--muted);font-size:13px;text-align:right}
.slot textarea{min-height:60px;border-left:6px solid var(--pc)}

.ranklist{display:grid;gap:10px}
.ritem{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;font-family:var(--mono);font-size:13px;box-shadow:0 3px 0 var(--line);align-items:center}
.ritem .pos{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted)}
.ritem.set .pos{background:var(--wc);color:#fff}
.ritem.right{border-color:var(--good)}.ritem.wrong{border-color:var(--bad)}

.rub{display:grid;gap:10px;margin-top:12px}
.rubrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center}
.seg5{display:flex;gap:6px}
.seg5 button{width:42px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;box-shadow:0 2px 0 var(--line)}
.seg5 button[aria-pressed="true"]{background:var(--wc);color:#fff;border-color:var(--wc)}
.seg5 button.exp{outline:3px solid var(--gold);outline-offset:2px}

.grade{margin-top:14px;border-radius:18px;padding:16px;background:var(--surface-2)}
.grade .score{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
.grade .score.pass{color:var(--good)}.grade .score.fail{color:var(--bad)}
.grade ul{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.grade .improved{margin-top:12px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:var(--surface);border-radius:12px;padding:10px 12px}
.grade .chip{display:inline-flex;font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.weak{font-family:var(--mono);font-size:14px;background:var(--bad-soft);border-radius:10px;padding:7px 11px;display:inline-block;margin-bottom:10px}
.mission{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.mission h4{margin:0 0 8px;font-size:21px}

/* Trophies */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.badge{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.badge svg{width:52px;height:52px;flex:none}
.badge.off{opacity:.5;box-shadow:none}
.badge.off svg{filter:grayscale(1)}
.badge b{display:block;font-size:15px}
.badge span{font-size:13px;color:var(--muted)}
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px;margin-top:12px}
.rk{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:var(--surface)}
.rk svg{width:40px;height:48px}
.rk.me{border:2px solid var(--gold);box-shadow:0 4px 0 var(--gold)}
.rk .x{font-size:12px;color:var(--muted);font-weight:600}
.rk b{display:block;font-size:14px}

/* Champion card */
.cert{margin-top:46px}
.certificate{border-radius:28px;padding:34px 22px;text-align:center;background:linear-gradient(135deg,var(--w2),var(--w6) 55%,var(--w1));color:#fff;box-shadow:var(--shadow)}
.certificate .eyebrow{color:rgba(255,255,255,.85)}
.certificate h2{font-size:clamp(30px,5vw,48px);font-weight:800;color:#fff}
.certificate .who{font-family:var(--display);font-size:36px;font-weight:800;border-bottom:2px solid rgba(255,255,255,.5);display:inline-block;padding:0 18px 2px;margin:10px 0}

/* Toasts / modal */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:20;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 16px;font-weight:700;font-size:15px;box-shadow:0 10px 26px rgba(0,0,0,.3);animation:pop .35s cubic-bezier(.2,1.5,.4,1);max-width:300px}
.toast small{display:block;font-weight:500;opacity:.8}
@keyframes pop{from{transform:translateY(16px) scale(.9);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(12,14,34,.6);display:grid;place-items:center;z-index:30;padding:20px;backdrop-filter:blur(3px)}
.modal .card{background:var(--surface);border-radius:28px;padding:30px;text-align:center;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.modal svg{width:96px;height:114px}
.modal h2{font-size:40px;font-weight:800;margin:6px 0 8px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .howto{grid-template-columns:1fr}
  .stats{margin-left:0;width:100%}
}
@media (max-width:640px){
  .trow,.trow.alt{flex-direction:row;justify-content:flex-start;gap:14px;transform:none!important}
  .wnode{width:84px;height:84px}.wnode .disc{width:64px;height:64px}.wnode .disc svg{width:30px;height:30px}
  .wcard{flex:1 1 auto}
  .track::before,.track .prog{top:21px}
  .stage .dot{width:48px;height:48px}.stage.boss .dot{width:52px;height:52px;margin-top:-2px}
  .stage .lbl{font-size:11.5px}
  .duel{grid-template-columns:1fr}
  .rubrow{grid-template-columns:1fr}
  .hud{position:static}
  .pill.ai{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<header class="hud">
  <div class="wrap">

    <nav class="nav" id="nav"></nav>
    <div class="stats" id="stats"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
/* ============ DATA ============ */
const PARTS = [
  {k:'role', n:'Role', d:'Who the AI should be.', ex:'You are a patient personal-finance coach.'},
  {k:'task', n:'Task', d:'The job, stated with a clear action verb.', ex:'Create a simple monthly budget plan for me.'},
  {k:'context', n:'Context', d:'What the AI can’t guess: audience, purpose, situation, background.', ex:'I\u2019m 28, just started my first full-time job, and I\u2019ve never made a budget.'},
  {k:'examples', n:'Examples', d:'A sample of what “good” looks like.', ex:'I like explanations like: \u201cThink of savings as paying your future self first.\u201d'},
  {k:'format', n:'Format', d:'The shape of the output.', ex:'Use a table with columns for Category, Amount, and Notes.'},
  {k:'constraints', n:'Constraints', d:'Limits, rules, and tone.', ex:'Under 300 words. No jargon. Don\u2019t recommend specific stocks.'}
];
const PART = Object.fromEntries(PARTS.map(p=>[p.k,p]));

const PHASES = [
  {k:'ce', n:'Try It'},
  {k:'pp', n:'Your Take'},
  {k:'gen', n:'Power-Up'},
  {k:'dev', n:'Practice'},
  {k:'apply', n:'Boss'}
];

const RANKS = [
  {n:'Novice', a:'LV 1', xp:0},
  {n:'Apprentice', a:'LV 2', xp:120},
  {n:'Explorer', a:'LV 3', xp:280},
  {n:'Builder', a:'LV 4', xp:480},
  {n:'Crafter', a:'LV 5', xp:720},
  {n:'Specialist', a:'LV 6', xp:1000},
  {n:'Expert', a:'LV 7', xp:1320},
  {n:'Master', a:'LV 8', xp:1680},
  {n:'Prompt Sage', a:'LV 9', xp:2050}
];

const BADGES = [
  {k:'first_run', n:'First Contact', d:'Run your first prompt.'},
  {k:'iterator', n:'Iterator', d:'Run 5 prompts in the sandbox.'},
  {k:'reflect', n:'Deep Thinker', d:'Share your take 4 times.'},
  {k:'combo5', n:'Hot Streak', d:'5 correct answers in a row.'},
  {k:'combo10', n:'On Fire', d:'10 correct answers in a row.'},
  {k:'anatomy', n:'Ingredient Expert', d:'Perfect score on the World 1 boss.'},
  {k:'builder', n:'Builder', d:'Build a full six-ingredient prompt.'},
  {k:'coached', n:'Coachable', d:'Get your first prompt review from the coach.'},
  {k:'bughunter', n:'Bug Hunter', d:'Diagnose every flawed prompt exactly.'},
  {k:'judge', n:'Sound Judgment', d:'Match the pro on every score (within 1).'},
  {k:'capstone', n:'Prompt Master', d:'Beat the final boss.'},
  {k:'dhg', n:'Gold Standard', d:'Earn 3 stars in every world.'}
];

const XP = {ce:40, pp:40, gen:50, dev:80, apply:120};

const MODULES = [
/* ---------- MODULE 1 ---------- */
{id:'m1', title:'Six Ingredients', bloom:'Remember', lvl:1,
 obj:'Every great prompt uses the same six ingredients. Learn to spot them.',
 phases:{
  ce:{type:'sandbox', title:'Two Prompts, One Topic', intro:'Run Prompt A, then Prompt B. Same topic, very different instructions. Watch what comes back.',
    requireAll:true,
    prompts:[
      {label:'Prompt A', text:'Write something about teamwork.',
       canned:`Teamwork is the collaborative effort of a group to achieve a common goal. Effective teams communicate openly, respect each other's strengths, and share responsibility. In business, sports, and everyday life, teamwork leads to better outcomes and stronger relationships. As the saying goes, "Teamwork makes the dream work." By working together, people can accomplish more than they ever could alone...`},
      {label:'Prompt B', text:'You are an upbeat youth soccer coach. Write a 150-word pep talk for a team of 10-year-olds before the first game of their season. Use simple words, include one funny thing that could happen on the field, and end with a short team chant they can shout together.',
       canned:`Okay team, huddle up! Today is our very first game, and I am SO proud of you already.\n\nHere's the deal: we pass the ball, we cheer for each other, and we never give up, even if we're behind. Remember at practice when Max kicked the ball so hard it landed in the snack cooler? That's the kind of energy I want today. Just maybe aim for the goal this time.\n\nIf you fall down, get back up. If a teammate makes a mistake, give them a high five. Winning is fun, but trying your hardest together is what makes us a team.\n\nNow hands in the middle. On three:\n"One, two, three... TIGERS ROAR!"`}
    ]},
  pp:{type:'reflect', title:'What Happened?', intro:'Quick gut check. What did you notice?',
    questions:[
      {q:'Which response would you actually use with your team?', any:true, opts:['Response A','Response B'], fb:'Most people pick B. It was written for a specific audience, length, and purpose, so it was ready to use. A needed a total rewrite.'},
      {q:'What did Prompt B include that Prompt A didn’t? (Select all that apply.)', multi:true,
       opts:[{t:'A role for the AI (a youth soccer coach)',ok:1},{t:'Who the audience is (10-year-olds before a game)',ok:1},{t:'A length (150 words)',ok:1},{t:'A required ending (a team chant)',ok:1},{t:'Bigger vocabulary words',ok:0}],
       fb:'Prompt B added a role, an audience, a length, and a specific structure. None of that is fancy wording. It’s information the AI could not have guessed.'}
    ],
    journal:'In one or two sentences: what was the biggest difference between the two responses, and why do you think it happened?'},
  gen:{type:'lesson', title:'The Six Ingredients', intro:'Every strong prompt is built from the same six ingredients. Quick questions only need two or three. Big deliverables need all six.',
    showParts:true,
    mnemonic:'<b>R</b>eally <b>T</b>asty <b>C</b>akes <b>E</b>ven <b>F</b>eed <b>C</b>rowds',
    mnemonicNote:'Role · Task · Context · Examples · Format · Constraints',
    check:{q:'Which part answers “Who is going to read this, and why?”', opts:['Role','Task','Context','Format'], ok:2, why:'Context covers audience, purpose, and background: the things the AI can’t know unless you tell it. Role is who the AI is, not who the reader is.'}},
  dev:{type:'tagger', title:'Ingredient Spotter', intro:'Pick an ingredient from the palette, then tap the matching piece of the prompt. Tag every piece to clear the stage.',
    items:[
      {segs:[['role','You are a friendly travel planner.'],['task','Plan a 3-day weekend trip to Chicago'],['context','for a couple in their 60s who love museums and don\u2019t enjoy long walks.'],['format','Lay it out day by day, with morning, afternoon, and evening.'],['constraints','Keep the total under $1,200 and skip the nightlife.'],['examples','Style I like: \u201cMorning: Art Institute (2 hrs). Grab a bench in the Impressionist wing.\u201d']]},
      {segs:[['task','Summarize the news article below'],['role','the way a fun science teacher would.'],['context','I want to talk about it at dinner tonight with my kids, ages 8 and 12.'],['format','Give me 4 short bullets and one question to ask the kids.'],['examples','A good bullet sounds like: \u201cScientists found a way to pull plastic out of the ocean using tiny bubbles.\u201d'],['constraints','Don\u2019t add any facts that aren\u2019t in the article.']]}
    ]},
  apply:{type:'quiz', boss:true, title:'The Ingredient Test', intro:'Six questions. Get 5 right to beat the boss and open World 2.', pass:5,
    questions:[
      {q:'“Use a table with columns for Date, Task, and Owner.” Which part is this?', opts:['Context','Format','Constraints','Task'], ok:1, why:'It describes the shape of the output: Format.'},
      {q:'“You are a patient math tutor for 7th graders.” Which part is this?', opts:['Role','Context','Examples','Task'], ok:0, why:'It tells the AI who to be: Role.'},
      {q:'\u201cThe audience is first-time homebuyers who know nothing about mortgages.\u201d Which part is this?', opts:['Role','Constraints','Context','Format'], ok:2, why:'Audience and background are Context.'},
      {q:'“No jargon, and stay under 150 words.” Which part is this?', opts:['Format','Constraints','Task','Examples'], ok:1, why:'Limits and rules are Constraints.'},
      {q:'Pasting in a paragraph you wrote last year and saying “match this style” is…', opts:['Context','Role','Examples','Task'], ok:2, why:'Showing a sample of what good looks like is an Example.'},
      {q:'Which part can a prompt NOT work without?', opts:['Role','Task','Examples','Format'], ok:1, why:'Everything else improves the result. Without a Task, there’s nothing for the AI to do.'}
    ]}
 }},
/* ---------- MODULE 2 ---------- */
{id:'m2', title:'Mind the Gap', bloom:'Understand', lvl:2,
 obj:'Find out why AI gives bland answers, and how to stop it.',
 phases:{
  ce:{type:'duel', title:'Prompt Duels', intro:'Three head-to-head matchups. Tap the prompt you think will get the better first-try result.',
    pairs:[
      {a:'Make a presentation about online safety.', b:'Create an outline for a 10-slide presentation that teaches my grandparents how to spot scam texts and phone calls. One idea per slide, no more than 3 bullets per slide, plain words, and end with a 3-question quiz.', better:'b', why:'B names the audience, the scope (scams, not all of online safety), the size, and the structure. A leaves all of that to chance.'},
      {a:'Write a 200-word post for our neighborhood Facebook group announcing the block party on Saturday, June 14, 2\u20136 pm at Maple Park. Mention it\u2019s a potluck with kids\u2019 games, and how to RSVP. Friendly, upbeat tone.', b:'You are an expert writer. Write a great, amazing, really good post about the block party. Make it good and interesting. This is VERY important!!!', better:'a', why:'Hype words (“amazing,” “VERY important”) add emotion, not information. A gives facts, length, purpose, and tone.'},
      {a:'Summarize this.', b:'Summarize the school email below in 3 bullets for my spouse, focusing only on dates and things we need to decide.\n\nEMAIL:\n"""\n(paste email here)\n"""', better:'b', why:'B gives a reader, a purpose, a focus, a format, and clearly marks where the source text begins and ends.'}
    ]},
  pp:{type:'reflect', title:'Spot the Pattern', intro:'Look back at the winners.',
    questions:[
      {q:'What did the winning prompts have in common?', opts:[{t:'They were longer',ok:0},{t:'They gave specifics the AI couldn’t guess',ok:1},{t:'They used more polite wording',ok:0},{t:'They used technical vocabulary',ok:0}],
       fb:'Length was a side effect, not the goal. The winners supplied details (audience, scope, format, facts) the AI had no way to know.'}
    ],
    journal:'Think of a time an AI gave you a disappointing answer. What do you think it was missing?'},
  gen:{type:'lesson', title:'How the AI Reads Your Prompt', intro:'Five ideas explain almost every bad result.',
    cards:[
      {h:'It predicts. It doesn’t read minds.', b:'The AI writes the most likely response to the words you give it. Anything you leave out gets filled with the average, and average reads as generic.'},
      {h:'Talk to it like a smart helper who just walked in.', b:'It\u2019s fast and well-read, but knows nothing about your life, your audience, or what you consider good. Tell it what you\u2019d tell a helpful friend who\u2019s new to the situation.'},
      {h:'Specific beats emphatic.', b:'“VERY IMPORTANT” and “make it amazing” carry no information. Numbers, names, audiences, and examples do.'},
      {h:'Five classic misses.', b:'Vague task · Missing context · No format · Conflicting instructions · Assumed knowledge (it doesn\u2019t know your situation, your files, or past conversations).'},
      {h:'Confident is not correct.', b:'AI can invent facts, numbers, and citations that sound right. Give it your source material and tell it not to add facts.', ex:'Answer only from the text below. If it isn’t there, say “Not in source.”'}
    ],
    check:{q:'Why does “Write a cover letter” usually produce a generic letter?', opts:['The AI is lazy with short prompts','The AI fills every missing detail with the most typical answer','Cover letters are too hard for AI','It needs the word “please”'], ok:1, why:'No job, company, experience, or tone means the AI defaults to the most common version of a cover letter.'}},
  dev:{type:'quiz', title:'Classify the Miss', intro:'Name the failure type for each prompt. These five labels will come up again and again.', pass:0,
    questions:[
      {q:'“Write a short, detailed, comprehensive summary.”', opts:['Vague task','Missing context','No format','Conflicting instructions','Assumed knowledge'], ok:3, why:'“Short” and “comprehensive” pull in opposite directions. The AI has to pick one.'},
      {q:'\u201cFix the problems in the plan we talked about.\u201d', opts:['Vague task','Missing context','No format','Conflicting instructions','Assumed knowledge'], ok:4, why:'The AI wasn\u2019t in that conversation and doesn\u2019t have the plan. Paste it in and list the problems.'},
      {q:'\u201cWrite about dogs.\u201d', opts:['Vague task','Missing context','No format','Conflicting instructions','Assumed knowledge'], ok:0, why:'\u201cWrite about\u201d isn\u2019t a job. A poem? A training guide? A list of breeds? For whom?'},
      {q:'\u201cCreate a workout schedule for me.\u201d', opts:['Vague task','Missing context','No format','Conflicting instructions','Assumed knowledge'], ok:1, why:'The task is clear, but the AI doesn\u2019t know your fitness level, goals, schedule, or equipment.'},
      {q:'\u201cCompare three budgeting apps.\u201d (You wanted a side-by-side table.)', opts:['Vague task','Missing context','No format','Conflicting instructions','Assumed knowledge'], ok:2, why:'Without a format you might get three essays. Ask for a table and name the columns.'},
      {q:'\u201cExplain my company\u2019s vacation policy.\u201d', opts:['Vague task','Missing context','No format','Conflicting instructions','Assumed knowledge'], ok:4, why:'It doesn\u2019t know your company\u2019s policy, so it may invent one that sounds official.'}
    ]},
  apply:{type:'quiz', boss:true, title:'The Explainer', intro:'Five questions on why prompts hit or miss. Get 4 right to win.', pass:4,
    questions:[
      {q:'A coworker says “AI is useless. It gives me junk.” Their prompt was \u201cWrite an email.\u201d What\u2019s the best explanation?', opts:['The AI tool is broken','The prompt left almost everything for the AI to guess','Emails are too personal for AI','They needed a longer email'], ok:1, why:'No subject, reader, purpose, or format, so the AI guessed all of it.'},
      {q:'Adding “This is VERY IMPORTANT!!!” to a prompt usually…', opts:['Makes the AI try harder','Adds emotion but no usable information','Gets a longer answer','Breaks the prompt'], ok:1, why:'Replace emphasis with specifics: who it’s for, what it must include, how long.'},
      {q:'Why paste the source document into the prompt instead of asking from memory?', opts:['It makes the prompt look professional','So answers are grounded in your real content and are less likely to be invented','The AI can’t answer without a document','It’s faster to read'], ok:1, why:'Grounding the AI in your text is the best defense against confident made-up details.'},
      {q:'Which comparison fits prompting best?', opts:['A prompt is a search query: fewer words is better','A prompt is like instructions for a contractor: the clearer the job, the better the result','A prompt is a password: exact words unlock answers','A prompt is a wish: be positive'], ok:1, why:'Like a contractor, the AI does its best work when the job, the purpose, and the finish you expect are spelled out.'},
      {q:'Which prompt is most likely to work on the first try?', opts:['Help me with homework.','Make a quiz.','Write 5 multiple-choice questions to quiz my 10-year-old on the water cycle, using the textbook page pasted below. One correct answer and three believable wrong answers each.','Quiz about water, important!'], ok:2, why:'It has a task, an audience, a count, a source, and a standard for the wrong answers.'}
    ]}
 }},

/* ============ STATE ============ */
const KEY='promptops.v1';
const fresh=()=>({xp:0,done:{},scores:{},badges:{},streak:0,best:0,runs:0,journals:{},drafts:{},flawExact:{},rubricMatch:{},unlockAll:false,name:'',certDate:''});
let S=fresh();
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

let view={screen:'home',mi:0,pi:0};
let sample=null, aiState='checking';


/* ============ HELPERS ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function h(tag,attrs={},...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='style')el.setAttribute('style',v);else el.setAttribute(k,v===true?'':v);}for(const kd of kids.flat()){if(kd==null||kd===false)continue;el.append(kd.nodeType?kd:document.createTextNode(kd));}return el;}
const rankIdx=xp=>{let i=0;RANKS.forEach((r,j)=>{if(xp>=r.xp)i=j});return i};
const words=s=>(s||'').trim().split(/\s+/).filter(Boolean).length;

function insignia(i){
  const c='var(--brass)';const top=i===RANKS.length-1;
  const pct=(i+1)/RANKS.length, R=15, C=2*Math.PI*R;
  let g=`<circle cx="20" cy="24" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="4"/><circle cx="20" cy="24" r="${R}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 20 24)"/>`;
  g+= top?`<polygon points="20,15 22.6,21 29,21.4 24,25.5 25.6,32 20,28.4 14.4,32 16,25.5 11,21.4 17.4,21" fill="${c}"/>`
         :`<text x="20" y="29.5" text-anchor="middle" font-family="Bricolage Grotesque,system-ui,sans-serif" font-size="15" font-weight="800" fill="${c}">${i+1}</text>`;
  return `<svg viewBox="0 0 40 48" aria-hidden="true">${g}</svg>`;
}
function badgeSvg(i,on){const cs=['--p-role','--p-task','--p-context','--p-examples','--p-format','--p-constraints'];const c=`var(${cs[i%6]})`;
  return `<svg viewBox="0 0 48 48" aria-hidden="true"><polygon points="24,3 43,14 43,34 24,45 5,34 5,14" fill="${on?c:'var(--surface-2)'}" stroke="${c}" stroke-width="2"/><text x="24" y="30" text-anchor="middle" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="800" font-size="16" fill="${on?'var(--surface)':c}">${i+1}</text></svg>`;}
const flame=`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1c1 3 4 4.5 4 8a4 4 0 0 1-8 0c0-2 1-3 2-4 0 1.5.6 2.4 1.4 2.6C7 5.5 7.4 3 8 1z" fill="currentColor"/></svg>`;

function toast(t,sub){const el=h('div',{class:'toast'},t,sub?h('small',{},sub):null);$('#toasts').append(el);setTimeout(()=>el.remove(),3200);}
function modal(html,btn='Carry on'){const m=h('div',{class:'modal',role:'dialog','aria-modal':'true'},h('div',{class:'card',html}));const b=h('button',{class:'btn primary',onclick:()=>m.remove()},btn);m.firstChild.append(b);$('#modalRoot').append(m);b.focus();}

function addXP(n,why){const before=rankIdx(S.xp);S.xp+=n;save();toast(`+${n} XP`,why);const after=rankIdx(S.xp);
  if(after>before){const r=RANKS[after];setTimeout(()=>modal(`${insignia(after)}<div class="eyebrow">Level up</div><h2>${esc(r.n)}</h2><p class="muted">You\u2019ve reached ${r.xp} XP. Keep going.</p>`,"Let\u2019s go"),500);} renderHUD();}
function award(k){if(S.badges[k])return;S.badges[k]=Date.now();save();const b=BADGES.find(x=>x.k===k);toast(`Badge earned: ${b.n}`,b.d);setTimeout(()=>addXP(25,'Badge bonus'),400);}
function streakHit(ok){if(ok){S.streak++;S.best=Math.max(S.best,S.streak);if(S.streak>=5)award('combo5');if(S.streak>=10)award('combo10');}else S.streak=0;save();renderHUD();}
function checkAllStars(){if(MODULES.every(m=>(S.scores[m.id]||0)>=100))award('dhg');}

/* ============ PROMPT ANALYSIS (local) ============ */
const DETECT={
  role:/\b(you are|you're|act as|acting as|as an? [a-z]+ (expert|instructor|writer|designer|officer|ncO|coach|teacher|editor|counselor|specialist|manager|recruiter)|pretend (you|to be)|take the role|your role)\b/i,
  task:/\b(write|create|draft|summari[sz]e|explain|list|generate|build|design|analy[sz]e|compare|rewrite|edit|plan|outline|develop|make|produce|review|tailor|suggest|give me|help me (write|create|draft|build|tailor|plan))\b/i,
  context:/\b(audience|for (new|my|our|a|an|the|staff|soldiers|recruits|students|employees|parents|leaders|people|team)|students|soldiers|recruits|employees|beginners|readers|team|because|so that|purpose|goal|background|situation|deadline|due|who (are|have|will)|most (are|have)|experience)\b/i,
  examples:/\b(example|e\.g\.|for instance|such as|sample|like this|here'?s (one|a|an)|model (after|on)|match (this|the) (style|tone))\b|["“][^"”]{12,}["”]/i,
  format:/\b(bullet|bullets|table|list|paragraphs?|steps|numbered|headings?|sections?|json|markdown|columns?|outline|one-page|1-page|page|slides?|email|script|format|subject line|checklist|\d+\s*(words|sentences|questions|items|points|bullets|slides|paragraphs|minutes?|seconds?))\b/i,
  constraints:/\b(no more than|under \d+|at most|at least|avoid|don't|do not|never|must|only|limit|maximum|minimum|tone|plain language|keep it|without|define|cite|if you (need|don'?t)|assumptions?)\b/i
};
function analyze(text){const p={};PARTS.forEach(x=>p[x.k]=DETECT[x.k].test(text||''));return p;}
function localGrade(text,opts={}){
  const p=analyze(text);const n=Object.values(p).filter(Boolean).length;const w=words(text);
  let score=n*13; if(w>=25)score+=8; if(w>=45)score+=6; if(w>350)score-=6;
